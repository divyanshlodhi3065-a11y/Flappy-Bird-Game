name: Build Flappy Bird APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Prepare Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          curl -L -o sdk.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools"

          unzip -q sdk.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools \
            "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest"

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify AIDL
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"

          echo "Checking Android SDK..."
          ls -la "$ANDROID_HOME"

          echo "Checking Build Tools..."
          ls -la "$ANDROID_HOME/build-tools"

          echo "Checking AIDL..."
          test -f "$ANDROID_HOME/build-tools/34.0.0/aidl"

          echo "AIDL FOUND!"

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-APK
          path: bin/*.apk
          if-no-files-found: error
